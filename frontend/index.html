<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Support Ticket Platform</title>
<style>
 :root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#667085;--line:#e3e6ec;--accent:#2f5bea}
 @media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d2129;--text:#e8ebf1;--muted:#98a2b3;--line:#2c323d;--accent:#6b8cff}}
 body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
 main{max-width:1000px;margin:0 auto;padding:20px}
 h1{font-size:20px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
 form{display:grid;grid-template-columns:1fr 160px;gap:10px}
 input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
 textarea{grid-column:1/3;min-height:60px;resize:vertical}
 .row{grid-column:1/3;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
 button{font:inherit;padding:8px 14px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
 button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
 #msg{font-size:13px} .err{color:#d92d20} .ok{color:#079455}
 .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
 .pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
 .pill b{color:var(--text)}
 .scroll{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:13px}
 th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
 td.desc{white-space:normal;min-width:220px} th{color:var(--muted);font-weight:600}
 .st{padding:2px 8px;border-radius:999px;font-size:12px}
 .QUEUED{background:#fef0c7;color:#93370d}.IN_PROGRESS{background:#d1e0ff;color:#1849a9}.RESOLVED{background:#d1fadf;color:#05603a}
 .critical{color:#d92d20;font-weight:600}.high{color:#dc6803;font-weight:600}
</style></head>
<body><main>
<h1>Employee Support Ticket Platform</h1>
<div class="sub">Raise a ticket. It is classified, prioritised, queued and processed by concurrent workers.</div>

<div class="card"><form id="f">
 <input id="emp" placeholder="Employee ID (e.g. EMP-014)" maxlength="30">
 <select id="urg"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select>
 <textarea id="desc" placeholder="Describe the issue, e.g. VPN keeps disconnecting" maxlength="300" required></textarea>
 <div class="row"><button type="submit">Raise ticket</button>
  <button type="button" class="alt" id="sample">Add 20 sample tickets</button><span id="msg"></span></div>
</form></div>

<div class="card">
 <div class="stats" id="stats"></div>
 <div class="scroll"><table><thead><tr><th>ID</th><th>Employee</th><th>Description</th><th>Category</th><th>Urgency</th><th>Priority</th><th>Status</th><th>Worker</th></tr></thead>
 <tbody id="rows"></tbody></table></div>
</div>

<script>
const $=id=>document.getElementById(id), msg=$("msg");
function say(t,c){msg.textContent=t;msg.className=c||""}
async function post(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||"Request failed"); return j;
}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  try{const t=await post("/api/tickets",{employee_id:$("emp").value,urgency:$("urg").value,description:$("desc").value});
    say(`Raised ${t.ticket_id} (${t.category}, priority ${t.priority})`,"ok"); $("desc").value=""; refresh();
  }catch(err){say(err.message,"err")}
});
$("sample").onclick=async()=>{
  try{const j=await post("/api/sample",{count:20}); say(`Added ${j.accepted} sample tickets`,"ok"); refresh();}
  catch(err){say(err.message,"err")}
};
function td(text,cls){const c=document.createElement("td");c.textContent=text;if(cls)c.className=cls;return c}
async function refresh(){
  try{
    const d=await (await fetch("/api/tickets")).json(), s=$("stats"); s.replaceChildren();
    const add=(k,v)=>{const p=document.createElement("span");p.className="pill";p.append(k+": ");const b=document.createElement("b");b.textContent=v;p.append(b);s.append(p)};
    add("Workers",d.workers); add("Queue",d.queue_size+"/"+d.queue_capacity);
    for(const k of ["QUEUED","IN_PROGRESS","RESOLVED"]) add(k.replace("_"," "),d.counts[k]||0);
    const tb=$("rows"); tb.replaceChildren();
    for(const t of d.tickets.slice(0,100)){
      const tr=document.createElement("tr");
      tr.append(td(t.ticket_id),td(t.employee_id),td(t.description,"desc"),td(t.category),td(t.urgency,t.urgency),td(t.priority));
      const st=document.createElement("td"),sp=document.createElement("span");sp.className="st "+t.status;sp.textContent=t.status.replace("_"," ");st.append(sp);
      tr.append(st,td(t.assigned_worker||"-")); tb.append(tr);
    }
  }catch(e){}
}
refresh(); setInterval(refresh,1000);
</script></main></body></html>
